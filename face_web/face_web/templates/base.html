<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Face Guard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span> Face Guard</div>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'on' if page == 'live' }}">Live</a>
      <a href="{{ url_for('people') }}" class="{{ 'on' if page == 'people' }}">People</a>
      <a href="{{ url_for('alerts') }}" class="{{ 'on' if page == 'alerts' }}">Alerts</a>
    </nav>
  </header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
